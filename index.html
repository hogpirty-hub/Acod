<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>АКОД: Тишина за периметром</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: 'Courier New', monospace;
  background: #0a0a0a;
  color: #e0e0e0;
  touch-action: none;
}

#versionBadge {
  position: fixed;
  top: 8px;
  right: 8px;
  z-index: 9999;
  background: rgba(0,0,0,0.85);
  color: #ff00ff;
  padding: 6px 12px;
  border: 1px solid #ff00ff;
  border-radius: 4px;
  font-size: 11px;
  font-weight: bold;
  text-shadow: 0 0 8px #ff00ff, 0 0 16px #ff00ff;
  box-shadow: 0 0 10px rgba(255,0,255,0.5);
  letter-spacing: 1px;
}

/* MENU SCREEN */
#menuScreen {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0a 100%);
  z-index: 100;
}

#menuScreen h1 {
  font-size: 28px;
  color: #ff4500;
  text-shadow: 0 0 20px #ff4500, 0 0 40px #ff4500;
  margin-bottom: 8px;
  text-align: center;
}

#menuScreen h2 {
  font-size: 14px;
  color: #888;
  margin-bottom: 40px;
  text-align: center;
}

.menuBtn {
  width: 260px;
  padding: 16px;
  margin: 8px;
  background: rgba(255,255,255,0.05);
  border: 1px solid #555;
  border-radius: 8px;
  color: #e0e0e0;
  font-size: 16px;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.2s;
}

.menuBtn:active {
  background: rgba(255,255,255,0.15);
  border-color: #FFD700;
  box-shadow: 0 0 15px rgba(255,215,0,0.5);
}

#joinInput {
  width: 260px;
  padding: 14px;
  margin: 8px;
  background: rgba(255,255,255,0.05);
  border: 1px solid #555;
  border-radius: 8px;
  color: #FFD700;
  font-size: 24px;
  text-align: center;
  font-family: inherit;
  letter-spacing: 8px;
  outline: none;
}

#joinInput:focus {
  border-color: #FFD700;
  box-shadow: 0 0 10px rgba(255,215,0,0.3);
}

/* LOBBY SCREEN */
#lobbyScreen {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0a 100%);
  z-index: 100;
}

#lobbyScreen h2 {
  font-size: 18px;
  color: #00FF7F;
  margin-bottom: 20px;
}

#roomCodeDisplay {
  font-size: 48px;
  color: #FFD700;
  letter-spacing: 12px;
  margin: 16px;
  text-shadow: 0 0 20px #FFD700;
  font-weight: bold;
}

#playerList {
  width: 280px;
  max-height: 200px;
  overflow-y: auto;
  margin: 16px;
}

.playerItem {
  display: flex;
  align-items: center;
  padding: 10px;
  margin: 6px 0;
  background: rgba(255,255,255,0.05);
  border-radius: 6px;
  border: 1px solid #333;
}

.playerColorDot {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  margin-right: 12px;
  box-shadow: 0 0 8px currentColor;
}

.playerName {
  font-size: 14px;
}

#colorBtn {
  padding: 12px 24px;
  margin: 8px;
  background: rgba(255,255,255,0.05);
  border: 1px solid #00BFFF;
  border-radius: 8px;
  color: #00BFFF;
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
}

#startBtn {
  padding: 16px 40px;
  margin: 16px;
  background: rgba(255,69,0,0.2);
  border: 2px solid #ff4500;
  border-radius: 8px;
  color: #ff4500;
  font-size: 18px;
  font-family: inherit;
  cursor: pointer;
  font-weight: bold;
  text-shadow: 0 0 10px #ff4500;
}

#startBtn:disabled {
  opacity: 0.4;
  border-color: #555;
  color: #555;
  text-shadow: none;
}

#statusText {
  font-size: 12px;
  color: #888;
  margin: 8px;
}

/* GAME SCREEN */
#gameScreen {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  display: none;
  z-index: 50;
}

#gameCanvas {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  background: #0a0a0a;
}

/* HUD */
#hud {
  position: absolute;
  top: 8px;
  left: 8px;
  right: 8px;
  display: flex;
  justify-content: space-between;
  pointer-events: none;
  z-index: 60;
}

.hudItem {
  background: rgba(0,0,0,0.7);
  padding: 6px 10px;
  border-radius: 4px;
  font-size: 12px;
  color: #e0e0e0;
  border: 1px solid #333;
}

#hpBar {
  width: 100px;
  height: 10px;
  background: #333;
  border-radius: 5px;
  overflow: hidden;
  border: 1px solid #555;
}

#hpFill {
  height: 100%;
  background: #00FF7F;
  transition: width 0.2s;
  box-shadow: 0 0 6px #00FF7F;
}

/* JOYSTICK */
#joystickArea {
  position: absolute;
  bottom: 30px;
  left: 30px;
  width: 130px;
  height: 130px;
  border-radius: 50%;
  background: rgba(255,255,255,0.05);
  border: 2px solid rgba(255,255,255,0.2);
  z-index: 70;
}

#joystickKnob {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 50px;
  height: 50px;
  margin: -25px 0 0 -25px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  border: 2px solid rgba(255,255,255,0.4);
  pointer-events: none;
}

/* ACTION BUTTONS */
#actionBtns {
  position: absolute;
  bottom: 30px;
  right: 30px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  z-index: 70;
}

.actionBtn {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  border: 2px solid;
  font-size: 12px;
  font-weight: bold;
  font-family: inherit;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

#fireBtn {
  background: rgba(255,69,0,0.2);
  border-color: #ff4500;
  color: #ff4500;
  text-shadow: 0 0 8px #ff4500;
}

#fireBtn:active {
  background: rgba(255,69,0,0.5);
  box-shadow: 0 0 20px rgba(255,69,0,0.8);
}

#reviveBtn {
  background: rgba(0,255,127,0.1);
  border-color: #00FF7F;
  color: #00FF7F;
  font-size: 11px;
  text-shadow: 0 0 8px #00FF7F;
}

#reviveBtn:active {
  background: rgba(0,255,127,0.3);
  box-shadow: 0 0 20px rgba(0,255,127,0.5);
}

/* GAME OVER */
#gameOverOverlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.85);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 200;
}

#gameOverOverlay h2 {
  font-size: 32px;
  color: #ff4500;
  text-shadow: 0 0 20px #ff4500;
  margin-bottom: 16px;
}

#gameOverOverlay p {
  color: #aaa;
  margin: 4px;
  font-size: 14px;
}

/* Landscape adjustments */
@media (orientation: landscape) and (max-height: 500px) {
  #joystickArea {
    bottom: 15px;
    left: 15px;
    width: 100px;
    height: 100px;
  }
  #joystickKnob {
    width: 40px;
    height: 40px;
    margin: -20px 0 0 -20px;
  }
  #actionBtns {
    bottom: 15px;
    right: 15px;
    gap: 8px;
  }
  .actionBtn {
    width: 65px;
    height: 65px;
    font-size: 10px;
  }
  #versionBadge {
    font-size: 9px;
    padding: 4px 8px;
  }
}

@media (max-width: 360px) {
  #menuScreen h1 { font-size: 22px; }
  .menuBtn { width: 220px; font-size: 14px; }
  #joinInput { width: 220px; font-size: 20px; }
}
</style>
</head>
<body>

<!-- VERSION BADGE -->
<div id="versionBadge">БИЛД v7.0 WI-FI</div>

<!-- MENU SCREEN -->
<div id="menuScreen">
  <h1>⚠ АКОД ⚠</h1>
  <h2>Тишина за периметром</h2>
  <button class="menuBtn" id="createRoomBtn">🏠 Создать комнату</button>
  <input type="text" id="joinInput" maxlength="3" placeholder="Код..." inputmode="numeric">
  <button class="menuBtn" id="joinRoomBtn">🔗 Войти в комнату</button>
</div>

<!-- LOBBY SCREEN -->
<div id="lobbyScreen">
  <h2>ЛОББИ</h2>
  <div id="roomCodeDisplay">---</div>
  <div id="statusText">Ожидание игроков...</div>
  <div id="playerList"></div>
  <button id="colorBtn">🎨 Сменить цвет</button>
  <button id="startBtn" disabled>▶ НАЧАТЬ КАТКУ</button>
</div>

<!-- GAME SCREEN -->
<div id="gameScreen">
  <canvas id="gameCanvas"></canvas>
  
  <div id="hud">
    <div class="hudItem">
      Волна: <span id="waveNum">1</span>
    </div>
    <div class="hudItem">
      <div id="hpBar"><div id="hpFill" style="width:100%"></div></div>
    </div>
    <div class="hudItem">
      Убито: <span id="killCount">0</span>
    </div>
  </div>

  <div id="joystickArea">
    <div id="joystickKnob"></div>
  </div>

  <div id="actionBtns">
    <button class="actionBtn" id="fireBtn">🔫<br>ОГОНЬ</button>
    <button class="actionBtn" id="reviveBtn">✚<br>ПОДНЯТЬ</button>
  </div>

  <div id="gameOverOverlay">
    <h2>ПРОВАЛ</h2>
    <p>Все игроки погибли</p>
    <p>Волна: <span id="finalWave">0</span></p>
    <p>Убито: <span id="finalKills">0</span></p>
    <button class="menuBtn" id="restartBtn" style="margin-top:20px">В МЕНЮ</button>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
// ============================================================
// АКОД: ТИШИНА ЗА ПЕРИМЕРОМ — БИЛД v7.0 WI-FI
// ============================================================

const COLORS = ['#FFD700', '#00FF7F', '#00BFFF', '#FF4500'];
const PLAYER_RADIUS = 12;
const ZOMBIE_RADIUS = 11;
const BULLET_SPEED = 8;
const PLAYER_SPEED = 2.5;
const ZOMBIE_SPEED = 1.2;
const SCREAMER_SPEED = 2.8;
const WORLD_W = 1600;
const WORLD_H = 1200;

// Audio context
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playSound(type) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    if (type === 'shoot') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(150, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'step') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(80 + Math.random() * 40, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    } else if (type === 'hit') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(300, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    } else if (type === 'revive') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, audioCtx.currentTime);
      osc.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }
  } catch(e) {}
}

// DOM elements
const menuScreen = document.getElementById('menuScreen');
const lobbyScreen = document.getElementById('lobbyScreen');
const gameScreen = document.getElementById('gameScreen');
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Network state
let peer = null;
let connections = {}; // id -> connection
let myConn = null;
let myId = null;
let isHost = false;
let roomCode = '';
let myColorIndex = 0;
let playerColor = COLORS[0];

// Game state
let STATE = {
  started: false,
  gameOver: false,
  wave: 1,
  kills: 0,
  players: {},
  zombies: [],
  bullets: []
};

// Input state
let moveX = 0, moveY = 0;
let isFiring = false;
let fireTimer = 0;
let stepTimer = 0;

// Buildings/obstacles
const buildings = [];
function generateBuildings() {
  buildings.length = 0;
  for (let i = 0; i < 12; i++) {
    let w = 60 + Math.random() * 120;
    let h = 60 + Math.random() * 100;
    let x = 100 + Math.random() * (WORLD_W - 200 - w);
    let y = 100 + Math.random() * (WORLD_H - 200 - h);
    buildings.push({x, y, w, h});
  }
}

// ============================================================
// MENU LOGIC
// ============================================================

document.getElementById('createRoomBtn').addEventListener('click', () => {
  initAudio();
  roomCode = String(Math.floor(100 + Math.random() * 900));
  isHost = true;
  myColorIndex = 0;
  playerColor = COLORS[0];
  
  peer = new Peer('akod_v7_host_' + roomCode, {
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' }
      ]
    }
  });

  peer.on('open', (id) => {
    myId = id;
    showLobby();
  });

  peer.on('connection', (conn) => {
    conn.on('open', () => {
      connections[conn.peer] = conn;
      // Assign color
      const colorIdx = Object.keys(connections).length % COLORS.length;
      const pId = conn.peer;
      STATE.players[pId] = {
        x: WORLD_W / 2 + (Object.keys(STATE.players).length * 40),
        y: WORLD_H / 2,
        angle: 0,
        hp: 100,
        color: COLORS[colorIdx],
        colorIndex: colorIdx,
        isDown: false,
        moveX: 0,
        moveY: 0,
        firing: false
      };
      sendToClient(conn, { type: 'welcome', id: pId, color: COLORS[colorIdx], colorIndex: colorIdx });
      updateLobbyUI();
    });
    conn.on('data', (data) => {
      handleClientData(conn, data);
    });
    conn.on('close', () => {
      delete connections[conn.peer];
      delete STATE.players[conn.peer];
      updateLobbyUI();
    });
    conn.on('error', (err) => {
      console.error('Connection error:', err);
    });
  });

  peer.on('error', (err) => {
    console.error('Peer error:', err);
    alert('Ошибка сети: ' + err.type);
  });

  // Add host as player
  STATE.players['host'] = {
    x: WORLD_W / 2,
    y: WORLD_H / 2,
    angle: 0,
    hp: 100,
    color: COLORS[0],
    colorIndex: 0,
    isDown: false,
    moveX: 0,
    moveY: 0,
    firing: false
  };
});

document.getElementById('joinRoomBtn').addEventListener('click', () => {
  initAudio();
  const code = document.getElementById('joinInput').value.trim();
  if (code.length !== 3) {
    alert('Введите 3-значный код комнаты');
    return;
  }
  roomCode = code;
  isHost = false;

  peer = new Peer({
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' }
      ]
    }
  });

  peer.on('open', (id) => {
    myId = id;
    myConn = peer.connect('akod_v7_host_' + roomCode, { reliable: true });
    
    myConn.on('open', () => {
      showLobby();
    });

    myConn.on('data', (data) => {
      handleHostData(data);
    });

    myConn.on('close', () => {
      if (STATE.started && !STATE.gameOver) {
        alert('Соединение с хостом потеряно');
        backToMenu();
      }
    });

    myConn.on('error', (err) => {
      console.error('Connection error:', err);
    });
  });

  peer.on('error', (err) => {
    console.error('Peer error:', err);
    if (err.type === 'peer-unavailable') {
      alert('Комната не найдена! Проверьте код.');
    }
  });
});

function sendToClient(conn, data) {
  if (conn && conn.open) {
    try { conn.send(data); } catch(e) {}
  }
}

function handleClientData(conn, data) {
  const pId = conn.peer;
  if (data.type === 'input') {
    if (STATE.players[pId]) {
      STATE.players[pId].moveX = data.moveX || 0;
      STATE.players[pId].moveY = data.moveY || 0;
      STATE.players[pId].firing = data.firing || false;
      STATE.players[pId].reviving = data.reviving || false;
    }
  } else if (data.type === 'colorChange') {
    if (STATE.players[pId]) {
      STATE.players[pId].color = data.color;
      STATE.players[pId].colorIndex = data.colorIndex;
    }
  }
}

function handleHostData(data) {
  if (data.type === 'welcome') {
    myId = data.id;
    myColorIndex = data.colorIndex;
    playerColor = data.color;
    updateLobbyUI();
  } else if (data.type === 'state') {
    STATE = data;
    if (STATE.started && lobbyScreen.style.display !== 'none') {
      startGameScreen();
    }
    if (STATE.gameOver && !document.getElementById('gameOverOverlay').style.display) {
      document.getElementById('gameOverOverlay').style.display = 'flex';
      document.getElementById('finalWave').textContent = STATE.wave;
      document.getElementById('finalKills').textContent = STATE.kills;
    }
    updateHUD();
  } else if (data.type === 'playerList') {
    renderPlayerList(data.players);
  }
}

function showLobby() {
  menuScreen.style.display = 'none';
  lobbyScreen.style.display = 'flex';
  document.getElementById('roomCodeDisplay').textContent = roomCode;
  updateLobbyUI();
}

function updateLobbyUI() {
  if (isHost) {
    document.getElementById('startBtn').disabled = false;
    document.getElementById('startBtn').style.display = 'block';
    document.getElementById('statusText').textContent = 
      'Подключено: ' + (Object.keys(STATE.players).length) + ' / 4';
    renderPlayerList(Object.entries(STATE.players).map(([id, p]) => ({
      id, name: id === 'host' ? 'Хост (вы)' : 'Игрок', color: p.color
    })));
    // Send player list to all clients
    const playerListData = Object.entries(STATE.players).map(([id, p]) => ({
      id, name: id === 'host' ? 'Хост' : 'Игрок', color: p.color
    }));
    Object.values(connections).forEach(conn => {
      sendToClient(conn, { type: 'playerList', players: playerListData });
    });
  } else {
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('statusText').textContent = 'Ожидание начала от хоста...';
  }
}

function renderPlayerList(players) {
  const list = document.getElementById('playerList');
  list.innerHTML = '';
  players.forEach(p => {
    const div = document.createElement('div');
    div.className = 'playerItem';
    div.innerHTML = `<div class="playerColorDot" style="background:${p.color};color:${p.color}"></div>
      <span class="playerName">${p.name}</span>`;
    list.appendChild(div);
  });
}

document.getElementById('colorBtn').addEventListener('click', () => {
  myColorIndex = (myColorIndex + 1) % COLORS.length;
  playerColor = COLORS[myColorIndex];
  
  if (isHost) {
    if (STATE.players['host']) {
      STATE.players['host'].color = playerColor;
      STATE.players['host'].colorIndex = myColorIndex;
    }
    updateLobbyUI();
  } else if (myConn && myConn.open) {
    myConn.send({ type: 'colorChange', color: playerColor, colorIndex: myColorIndex });
  }
});

document.getElementById('startBtn').addEventListener('click', () => {
  if (!isHost) return;
  initGame();
  STATE.started = true;
  startGameScreen();
  // Notify all clients
  Object.values(connections).forEach(conn => {
    sendToClient(conn, { type: 'start' });
  });
});

// ============================================================
// GAME INIT & LOOP
// ============================================================

function initGame() {
  generateBuildings();
  STATE.zombies = [];
  STATE.bullets = [];
  STATE.wave = 1;
  STATE.kills = 0;
  STATE.gameOver = false;
  spawnWave();
}

function spawnWave() {
  const count = 3 + STATE.wave * 2;
  for (let i = 0; i < count; i++) {
    const type = (Math.random() < 0.2 + STATE.wave * 0.05) ? 'screamer' : 'normal';
    let x, y;
    // Spawn at edges
    const side = Math.floor(Math.random() * 4);
    if (side === 0) { x = Math.random() * WORLD_W; y = -20; }
    else if (side === 1) { x = Math.random() * WORLD_W; y = WORLD_H + 20; }
    else if (side === 2) { x = -20; y = Math.random() * WORLD_H; }
    else { x = WORLD_W + 20; y = Math.random() * WORLD_H; }
    
    STATE.zombies.push({
      x, y,
      type,
      hp: type === 'screamer' ? 2 : 3,
      angle: 0,
      attackCd: 0
    });
  }
}

function startGameScreen() {
  lobbyScreen.style.display = 'none';
  gameScreen.style.display = 'block';
  resizeCanvas();
  requestAnimationFrame(gameLoop);
}

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);

// Game loop (runs on host primarily, but clients also render)
let lastTime = 0;
let stateBroadcastTimer = 0;
let zombieSpawnTimer = 0;

function gameLoop(timestamp) {
  if (STATE.gameOver && !document.getElementById('gameOverOverlay').style.display) {
    document.getElementById('gameOverOverlay').style.display = 'flex';
    document.getElementById('finalWave').textContent = STATE.wave;
    document.getElementById('finalKills').textContent = STATE.kills;
  }

  const dt = Math.min(32, timestamp - lastTime);
  lastTime = timestamp;

  if (isHost && STATE.started && !STATE.gameOver) {
    updateHostLogic(dt);
    
    stateBroadcastTimer += dt;
    if (stateBroadcastTimer >= 50) {
      stateBroadcastTimer = 0;
      broadcastState();
    }
  }

  if (!isHost && STATE.started) {
    // Send input to host
    sendInputToHost();
  }

  // Handle host's own input
  if (isHost && STATE.players['host'] && !STATE.players['host'].isDown) {
    STATE.players['host'].moveX = moveX;
    STATE.players['host'].moveY = moveY;
    STATE.players['host'].firing = isFiring;
  }

  render();
  
  if (STATE.started) {
    requestAnimationFrame(gameLoop);
  }
}

function updateHostLogic(dt) {
  const dtFactor = dt / 16.67;
  
  // Move players
  Object.entries(STATE.players).forEach(([id, player]) => {
    if (player.isDown) return;
    
    const len = Math.sqrt(player.moveX * player.moveX + player.moveY * player.moveY);
    if (len > 0.1) {
      const nx = player.moveX / len;
      const ny = player.moveY / len;
      let newX = player.x + nx * PLAYER_SPEED * dtFactor;
      let newY = player.y + ny * PLAYER_SPEED * dtFactor;
      
      // Collision with buildings
      let blocked = false;
      for (const b of buildings) {
        if (newX + PLAYER_RADIUS > b.x && newX - PLAYER_RADIUS < b.x + b.w &&
            newY + PLAYER_RADIUS > b.y && newY - PLAYER_RADIUS < b.y + b.h) {
          blocked = true;
          break;
        }
      }
      // World bounds
      newX = Math.max(PLAYER_RADIUS, Math.min(WORLD_W - PLAYER_RADIUS, newX));
      newY = Math.max(PLAYER_RADIUS, Math.min(WORLD_H - PLAYER_RADIUS, newY));
      
      if (!blocked) {
        player.x = newX;
        player.y = newY;
      }
      player.angle = Math.atan2(ny, nx);
      
      // Footstep sounds (only for host player)
      if (id === 'host') {
        stepTimer += dt;
        if (stepTimer > 300) {
          stepTimer = 0;
          playSound('step');
        }
      }
    }

    // Auto-fire at nearest zombie
    if (player.firing) {
      fireTimer += dt;
      if (fireTimer > 200) {
        fireTimer = 0;
        // Find nearest zombie
        let nearest = null;
        let nearDist = Infinity;
        STATE.zombies.forEach(z => {
          const d = Math.hypot(z.x - player.x, z.y - player.y);
          if (d < nearDist) { nearDist = d; nearest = z; }
        });
        if (nearest && nearDist < 500) {
          const angle = Math.atan2(nearest.y - player.y, nearest.x - player.x);
          STATE.bullets.push({
            x: player.x,
            y: player.y,
            vx: Math.cos(angle) * BULLET_SPEED,
            vy: Math.sin(angle) * BULLET_SPEED,
            life: 60,
            ownerId: id
          });
          if (id === 'host') playSound('shoot');
        }
      }
    } else {
      fireTimer = 180; // ready to fire quickly
    }

    // Revive nearby downed player
    if (player.reviving) {
      Object.entries(STATE.players).forEach(([otherId, other]) => {
        if (otherId !== id && other.isDown) {
          const d = Math.hypot(other.x - player.x, other.y - player.y);
          if (d < 50) {
            other.isDown = false;
            other.hp = 50;
            if (id === 'host') playSound('revive');
          }
        }
      });
    }
  });

  // Move zombies
  STATE.zombies.forEach(zombie => {
    // Find nearest alive player
    let target = null;
    let nearDist = Infinity;
    Object.values(STATE.players).forEach(p => {
      if (p.isDown) return;
      const d = Math.hypot(p.x - zombie.x, p.y - zombie.y);
      if (d < nearDist) { nearDist = d; target = p; }
    });

    if (target) {
      const angle = Math.atan2(target.y - zombie.y, target.x - zombie.x);
      zombie.angle = angle;
      const speed = zombie.type === 'screamer' ? SCREAMER_SPEED : ZOMBIE_SPEED;
      zombie.x += Math.cos(angle) * speed * dtFactor;
      zombie.y += Math.sin(angle) * speed * dtFactor;

      // Attack player
      if (nearDist < PLAYER_RADIUS + ZOMBIE_RADIUS) {
        zombie.attackCd -= dt;
        if (zombie.attackCd <= 0) {
          zombie.attackCd = 1000;
          target.hp -= zombie.type === 'screamer' ? 15 : 10;
          if (target.hp <= 0) {
            target.isDown = true;
            target.hp = 0;
          }
        }
      }
    }
  });

  // Move bullets
  STATE.bullets = STATE.bullets.filter(b => {
    b.x += b.vx * dtFactor;
    b.y += b.vy * dtFactor;
    b.life -= dtFactor;

    // Check zombie hits
    for (let i = STATE.zombies.length - 1; i >= 0; i--) {
      const z = STATE.zombies[i];
      if (Math.hypot(z.x - b.x, z.y - b.y) < ZOMBIE_RADIUS + 4) {
        z.hp--;
        if (z.hp <= 0) {
          STATE.zombies.splice(i, 1);
          STATE.kills++;
        }
        if (b.ownerId === 'host') playSound('hit');
        return false;
      }
    }

    // Building collision
    for (const bldg of buildings) {
      if (b.x > bldg.x && b.x < bldg.x + bldg.w && b.y > bldg.y && b.y < bldg.y + bldg.h) {
        return false;
      }
    }

    return b.life > 0;
  });

  // Check next wave
  if (STATE.zombies.length === 0) {
    STATE.wave++;
    spawnWave();
  }

  // Check game over
  const alivePlayers = Object.values(STATE.players).filter(p => !p.isDown);
  if (alivePlayers.length === 0) {
    STATE.gameOver = true;
  }
}

function broadcastState() {
  const stateCopy = {
    type: 'state',
    started: STATE.started,
    gameOver: STATE.gameOver,
    wave: STATE.wave,
    kills: STATE.kills,
    players: JSON.parse(JSON.stringify(STATE.players)),
    zombies: JSON.parse(JSON.stringify(STATE.zombies)),
    bullets: JSON.parse(JSON.stringify(STATE.bullets))
  };
  Object.values(connections).forEach(conn => {
    sendToClient(conn, stateCopy);
  });
}

function sendInputToHost() {
  if (myConn && myConn.open) {
    myConn.send({
      type: 'input',
      moveX: moveX,
      moveY: moveY,
      firing: isFiring
    });
  }
}

// ============================================================
// RENDERING
// ============================================================

function render() {
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (!STATE.started) return;

  // Camera: center on host or self
  let camTarget;
  if (isHost) {
    camTarget = STATE.players['host'];
  } else {
    camTarget = STATE.players[myId];
  }
  if (!camTarget) return;

  const camX = camTarget.x - canvas.width / 2;
  const camY = camTarget.y - canvas.height / 2;

  ctx.save();
  ctx.translate(-camX, -camY);

  // Draw ground grid
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  const gridSize = 80;
  const startX = Math.floor(camX / gridSize) * gridSize;
  const startY = Math.floor(camY / gridSize) * gridSize;
  for (let x = startX; x < camX + canvas.width + gridSize; x += gridSize) {
    ctx.beginPath();
    ctx.moveTo(x, camY);
    ctx.lineTo(x, camY + canvas.height);
    ctx.stroke();
  }
  for (let y = startY; y < camY + canvas.height + gridSize; y += gridSize) {
    ctx.beginPath();
    ctx.moveTo(camX, y);
    ctx.lineTo(camX + canvas.width, y);
    ctx.stroke();
  }

  // Draw buildings
  ctx.fillStyle = '#1a1a1a';
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2;
  buildings.forEach(b => {
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeRect(b.x, b.y, b.w, b.h);
  });

  // Draw world border
  ctx.strokeStyle = '#444';
  ctx.lineWidth = 3;
  ctx.strokeRect(0, 0, WORLD_W, WORLD_H);

  // Draw flashlight cones
  Object.values(STATE.players).forEach(p => {
    if (p.isDown) return;
    const gradient = ctx.createRadialGradient(p.x, p.y, 10, p.x, p.y, 200);
    gradient.addColorStop(0, p.color + '40');
    gradient.addColorStop(0.5, p.color + '15');
    gradient.addColorStop(1, 'transparent');
    
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.arc(p.x, p.y, 200, p.angle - 0.5, p.angle + 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  });

  // Draw zombies
  STATE.zombies.forEach(z => {
    ctx.save();
    ctx.translate(z.x, z.y);
    ctx.rotate(z.angle);
    
    if (z.type === 'screamer') {
      ctx.fillStyle = '#ff2255';
      ctx.shadowColor = '#ff2255';
      ctx.shadowBlur = 10;
    } else {
      ctx.fillStyle = '#4a7a4a';
      ctx.shadowColor = '#4a7a4a';
      ctx.shadowBlur = 5;
    }
    
    ctx.beginPath();
    ctx.arc(0, 0, ZOMBIE_RADIUS, 0, Math.PI * 2);
    ctx.fill();
    
    // Eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(5, -4, 3, 0, Math.PI * 2);
    ctx.arc(5, 4, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(6, -4, 1.5, 0, Math.PI * 2);
    ctx.arc(6, 4, 1.5, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.restore();
  });

  // Draw players
  Object.values(STATE.players).forEach(p => {
    ctx.save();
    ctx.translate(p.x, p.y);
    
    if (p.isDown) {
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = '#666';
      ctx.beginPath();
      ctx.arc(0, 0, PLAYER_RADIUS, 0, Math.PI * 2);
      ctx.fill();
      // Down indicator
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#ff4444';
      ctx.font = '10px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText('✚', 0, -20);
    } else {
      ctx.rotate(p.angle);
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(0, 0, PLAYER_RADIUS, 0, Math.PI * 2);
      ctx.fill();
      
      // Gun barrel
      ctx.fillStyle = '#ccc';
      ctx.fillRect(PLAYER_RADIUS - 2, -2, 10, 4);
      
      ctx.shadowBlur = 0;
    }
    
    ctx.restore();
  });

  // Draw bullets
  ctx.fillStyle = '#ffff00';
  ctx.shadowColor = '#ffff00';
  ctx.shadowBlur = 8;
  STATE.bullets.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.shadowBlur = 0;

  ctx.restore();

  // Darkness overlay (outside flashlight cones)
  // This is already handled by the dark background and cone lighting
}

function updateHUD() {
  document.getElementById('waveNum').textContent = STATE.wave;
  document.getElementById('killCount').textContent = STATE.kills;
  
  let myPlayer;
  if (isHost) {
    myPlayer = STATE.players['host'];
  } else {
    myPlayer = STATE.players[myId];
  }
  if (myPlayer) {
    document.getElementById('hpFill').style.width = Math.max(0, myPlayer.hp) + '%';
    if (myPlayer.hp <= 30) {
      document.getElementById('hpFill').style.background = '#ff4500';
    } else {
      document.getElementById('hpFill').style.background = '#00FF7F';
    }
  }
}

// ============================================================
// TOUCH CONTROLS
// ============================================================

const joystickArea = document.getElementById('joystickArea');
const joystickKnob = document.getElementById('joystickKnob');
let joystickTouchId = null;
let joystickCenterX = 0, joystickCenterY = 0;

joystickArea.addEventListener('touchstart', (e) => {
  e.preventDefault();
  initAudio();
  const touch = e.changedTouches[0];
  joystickTouchId = touch.identifier;
  const rect = joystickArea.getBoundingClientRect();
  joystickCenterX = rect.left + rect.width / 2;
  joystickCenterY = rect.top + rect.height / 2;
});

joystickArea.addEventListener('touchmove', (e) => {
  e.preventDefault();
  for (const touch of e.changedTouches) {
    if (touch.identifier === joystickTouchId) {
      const dx = touch.clientX - joystickCenterX;
      const dy = touch.clientY - joystickCenterY;
      const dist = Math.min(Math.hypot(dx, dy), 50);
      const angle = Math.atan2(dy, dx);
      
      joystickKnob.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`;
      
      moveX = (Math.cos(angle) * dist) / 50;
      moveY = (Math.sin(angle) * dist) / 50;
    }
  }
});

joystickArea.addEventListener('touchend', (e) => {
  e.preventDefault();
  for (const touch of e.changedTouches) {
    if (touch.identifier === joystickTouchId) {
      joystickTouchId = null;
      joystickKnob.style.transform = 'translate(0,0)';
      moveX = 0;
      moveY = 0;
    }
  }
});

// Fire button
const fireBtn = document.getElementById('fireBtn');
let fireTouchId = null;

fireBtn.addEventListener('touchstart', (e) => {
  e.preventDefault();
  initAudio();
  isFiring = true;
  fireTouchId = e.changedTouches[0].identifier;
});

fireBtn.addEventListener('touchend', (e) => {
  e.preventDefault();
  for (const touch of e.changedTouches) {
    if (touch.identifier === fireTouchId) {
      isFiring = false;
      fireTouchId = null;
    }
  }
});

// Revive button
const reviveBtn = document.getElementById('reviveBtn');

reviveBtn.addEventListener('touchstart', (e) => {
  e.preventDefault();
  initAudio();
  // Revive handled in game logic when reviving flag is set
  if (isHost) {
    // Immediate revive check
    const host = STATE.players['host'];
    if (host && !host.isDown) {
      Object.entries(STATE.players).forEach(([otherId, other]) => {
        if (otherId !== 'host' && other.isDown) {
          const d = Math.hypot(other.x - host.x, other.y - host.y);
          if (d < 50) {
            other.isDown = false;
            other.hp = 50;
            playSound('revive');
          }
        }
      });
    }
  } else if (myConn && myConn.open) {
    myConn.send({ type: 'input', moveX, moveY, firing: isFiring, reviving: true });
  }
});

// Restart button
document.getElementById('restartBtn').addEventListener('click', () => {
  backToMenu();
});

function backToMenu() {
  gameScreen.style.display = 'none';
  lobbyScreen.style.display = 'none';
  menuScreen.style.display = 'flex';
  document.getElementById('gameOverOverlay').style.display = 'none';
  STATE.started = false;
  STATE.gameOver = false;
  
  // Cleanup
  if (peer) {
    peer.destroy();
    peer = null;
  }
  connections = {};
  myConn = null;
  STATE.players = {};
  STATE.zombies = [];
  STATE.bullets = [];
}

// Prevent zoom on double tap
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

// Keyboard support for desktop testing
document.addEventListener('keydown', (e) => {
  if (!STATE.started) return;
  if (e.key === 'w' || e.key === 'ц') moveY = -1;
  if (e.key === 's' || e.key === 'ы') moveY = 1;
  if (e.key === 'a' || e.key === 'ф') moveX = -1;
  if (e.key === 'd' || e.key === 'в') moveX = 1;
  if (e.key === ' ') isFiring = true;
});

document.addEventListener('keyup', (e) => {
  if (e.key === 'w' || e.key === 'ц' || e.key === 's' || e.key === 'ы') moveY = 0;
  if (e.key === 'a' || e.key === 'ф' || e.key === 'd' || e.key === 'в') moveX = 0;
  if (e.key === ' ') isFiring = false;
});

</script>
