<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>АКОД: Тишина за периметром — v8.0 DIRECT</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: 'Courier New', monospace;
  background: #0a0a0a;
  color: #e0e0e0;
  touch-action: none;
  -webkit-touch-callout: none;
}

#versionBadge {
  position: fixed;
  top: 8px;
  right: 8px;
  z-index: 9999;
  background: rgba(0,0,0,0.85);
  color: #00ffff;
  padding: 6px 12px;
  border: 1px solid #00ffff;
  border-radius: 4px;
  font-size: 11px;
  font-weight: bold;
  text-shadow: 0 0 8px #00ffff, 0 0 16px #00ffff;
  box-shadow: 0 0 10px rgba(0,255,255,0.5);
  letter-spacing: 1px;
  pointer-events: none;
}

/* MENU SCREEN */
#menuScreen {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0a 100%);
  z-index: 100;
}

#menuScreen h1 {
  font-size: 28px;
  color: #ff4500;
  text-shadow: 0 0 20px #ff4500, 0 0 40px #ff4500;
  margin-bottom: 8px;
  text-align: center;
}

#menuScreen h2 {
  font-size: 14px;
  color: #888;
  margin-bottom: 40px;
  text-align: center;
}

.menuBtn {
  width: 260px;
  padding: 16px;
  margin: 8px;
  background: rgba(255,255,255,0.05);
  border: 1px solid #555;
  border-radius: 8px;
  color: #e0e0e0;
  font-size: 16px;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.2s;
}

.menuBtn:active {
  background: rgba(255,255,255,0.15);
  border-color: #FFD700;
  box-shadow: 0 0 15px rgba(255,215,0,0.5);
}

#joinInput {
  width: 260px;
  padding: 14px;
  margin: 8px;
  background: rgba(255,255,255,0.05);
  border: 1px solid #555;
  border-radius: 8px;
  color: #FFD700;
  font-size: 24px;
  text-align: center;
  font-family: inherit;
  letter-spacing: 8px;
  outline: none;
  text-transform: uppercase;
}

#joinInput:focus {
  border-color: #FFD700;
  box-shadow: 0 0 10px rgba(255,215,0,0.3);
}

/* LOBBY SCREEN */
#lobbyScreen {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0a 100%);
  z-index: 100;
}

#lobbyScreen h2 {
  font-size: 18px;
  color: #00FF7F;
  margin-bottom: 20px;
}

#roomCodeDisplay {
  font-size: 48px;
  color: #FFD700;
  letter-spacing: 12px;
  margin: 16px;
  text-shadow: 0 0 20px #FFD700;
  font-weight: bold;
}

#playerList {
  width: 280px;
  max-height: 220px;
  overflow-y: auto;
  margin: 16px;
}

.playerItem {
  display: flex;
  align-items: center;
  padding: 10px;
  margin: 6px 0;
  background: rgba(255,255,255,0.05);
  border-radius: 6px;
  border: 1px solid #333;
}

.playerColorDot {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  margin-right: 12px;
  box-shadow: 0 0 8px currentColor;
}

.playerName {
  font-size: 14px;
}

#colorBtn {
  padding: 12px 24px;
  margin: 8px;
  background: rgba(255,255,255,0.05);
  border: 1px solid #00BFFF;
  border-radius: 8px;
  color: #00BFFF;
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
}

#startBtn {
  padding: 16px 40px;
  margin: 16px;
  background: rgba(255,69,0,0.2);
  border: 2px solid #ff4500;
  border-radius: 8px;
  color: #ff4500;
  font-size: 18px;
  font-family: inherit;
  cursor: pointer;
  font-weight: bold;
  text-shadow: 0 0 10px #ff4500;
}

#startBtn:disabled {
  opacity: 0.4;
  border-color: #555;
  color: #555;
  text-shadow: none;
}

#statusText {
  font-size: 12px;
  color: #888;
  margin: 8px;
  text-align: center;
}

/* GAME SCREEN */
#gameScreen {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  display: none;
  z-index: 50;
}

#gameCanvas {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  background: #0a0a0a;
  display: block;
}

/* HUD */
#hud {
  position: absolute;
  top: 8px;
  left: 8px;
  right: 8px;
  display: flex;
  justify-content: space-between;
  pointer-events: none;
  z-index: 60;
}

.hudItem {
  background: rgba(0,0,0,0.7);
  padding: 6px 10px;
  border-radius: 4px;
  font-size: 12px;
  color: #e0e0e0;
  border: 1px solid #333;
}

#hpBar {
  width: 100px;
  height: 10px;
  background: #333;
  border-radius: 5px;
  overflow: hidden;
  border: 1px solid #555;
}

#hpFill {
  height: 100%;
  background: #00FF7F;
  transition: width 0.2s;
  box-shadow: 0 0 6px #00FF7F;
}

/* JOYSTICK */
#joystickArea {
  position: absolute;
  bottom: 30px;
  left: 30px;
  width: 130px;
  height: 130px;
  border-radius: 50%;
  background: rgba(255,255,255,0.05);
  border: 2px solid rgba(255,255,255,0.2);
  z-index: 70;
}

#joystickKnob {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 50px;
  height: 50px;
  margin: -25px 0 0 -25px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  border: 2px solid rgba(255,255,255,0.4);
  pointer-events: none;
}

/* ACTION BUTTONS */
#actionBtns {
  position: absolute;
  bottom: 30px;
  right: 30px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  z-index: 70;
}

.actionBtn {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  border: 2px solid;
  font-size: 12px;
  font-weight: bold;
  font-family: inherit;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: transparent;
}

#fireBtn {
  background: rgba(255,69,0,0.2);
  border-color: #ff4500;
  color: #ff4500;
  text-shadow: 0 0 8px #ff4500;
}

#fireBtn:active {
  background: rgba(255,69,0,0.5);
  box-shadow: 0 0 20px rgba(255,69,0,0.8);
}

#reviveBtn {
  background: rgba(0,255,127,0.1);
  border-color: #00FF7F;
  color: #00FF7F;
  font-size: 11px;
  text-shadow: 0 0 8px #00FF7F;
}

#reviveBtn:active {
  background: rgba(0,255,127,0.3);
  box-shadow: 0 0 20px rgba(0,255,127,0.5);
}

/* GAME OVER */
#gameOverOverlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.85);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 200;
}

#gameOverOverlay h2 {
  font-size: 32px;
  color: #ff4500;
  text-shadow: 0 0 20px #ff4500;
  margin-bottom: 16px;
}

#gameOverOverlay p {
  color: #aaa;
  margin: 4px;
  font-size: 14px;
}

/* Landscape adjustments */
@media (orientation: landscape) and (max-height: 500px) {
  #joystickArea {
    bottom: 15px;
    left: 15px;
    width: 100px;
    height: 100px;
  }
  #joystickKnob {
    width: 40px;
    height: 40px;
    margin: -20px 0 0 -20px;
  }
  #actionBtns {
    bottom: 15px;
    right: 15px;
    gap: 8px;
  }
  .actionBtn {
    width: 65px;
    height: 65px;
    font-size: 10px;
  }
  #versionBadge {
    font-size: 9px;
    padding: 4px 8px;
  }
}

@media (max-width: 360px) {
  #menuScreen h1 { font-size: 22px; }
  .menuBtn { width: 220px; font-size: 14px; }
  #joinInput { width: 220px; font-size: 20px; }
}
</style>

<body>

<!-- VERSION BADGE -->
<div id="versionBadge">БИЛД v8.0 DIRECT</div>

<!-- MENU SCREEN -->
<div id="menuScreen">
  <h1>⚠ АКОД ⚠</h1>
  <h2>Тишина за периметром</h2>
  <button class="menuBtn" id="createRoomBtn">🏠 Создать комнату</button>
  <input type="text" id="joinInput" maxlength="3" placeholder="Код..." inputmode="numeric">
  <button class="menuBtn" id="joinRoomBtn">🔗 Войти в комнату</button>
</div>

<!-- LOBBY SCREEN -->
<div id="lobbyScreen">
  <h2>ЛОББИ</h2>
  <div id="roomCodeDisplay">---</div>
  <div id="statusText">Поиск игроков через WebTorrent...</div>
  <div id="playerList"></div>
  <button id="colorBtn">🎨 Сменить цвет</button>
  <button id="startBtn" disabled>▶ НАЧАТЬ КАТКУ</button>
</div>

<!-- GAME SCREEN -->
<div id="gameScreen">
  <canvas id="gameCanvas"></canvas>
  
  <div id="hud">
    <div class="hudItem">
      Волна: <span id="waveNum">1</span>
    </div>
    <div class="hudItem">
      <div id="hpBar"><div id="hpFill" style="width:100%"></div></div>
    </div>
    <div class="hudItem">
      Убито: <span id="killCount">0</span>
    </div>
  </div>

  <div id="joystickArea">
    <div id="joystickKnob"></div>
  </div>

  <div id="actionBtns">
    <button class="actionBtn" id="fireBtn">🔫<br>ОГОНЬ</button>
    <button class="actionBtn" id="reviveBtn">✚<br>ПОДНЯТЬ</button>
  </div>

  <div id="gameOverOverlay">
    <h2>ПРОВАЛ</h2>
    <p>Все игроки погибли</p>
    <p>Волна: <span id="finalWave">0</span></p>
    <p>Убито: <span id="finalKills">0</span></p>
    <button class="menuBtn" id="restartBtn" style="margin-top:20px">В МЕНЮ</button>
  </div>
</div>

<script type="module">
// ============================================================
// АКОД: ТИШИНА ЗА ПЕРИМЕРОМ — БИЛД v8.0 DIRECT
// Прямое P2P через Trystero (WebTorrent)
// ============================================================

import { joinRoom } from 'https://esm.run/trystero/torrent';

// Константы игры
const COLORS = ['#FFD700', '#00FF7F', '#00BFFF', '#FF4500'];
const PLAYER_RADIUS = 12;
const ZOMBIE_RADIUS = 11;
const BULLET_SPEED = 9;
const PLAYER_SPEED = 2.5;
const ZOMBIE_SPEED = 1.2;
const SCREAMER_SPEED = 2.8;
const WORLD_W = 1600;
const WORLD_H = 1200;
const HOST_BROADCAST_INTERVAL = 60; // мс

// DOM элементы
const menuScreen = document.getElementById('menuScreen');
const lobbyScreen = document.getElementById('lobbyScreen');
const gameScreen = document.getElementById('gameScreen');
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// ============================================================
// АУДИО (Web Audio API)
// ============================================================
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e) { console.warn('Audio init failed'); }
  }
}

function playSound(type) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    const now = audioCtx.currentTime;
    
    if (type === 'shoot') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.exponentialRampToValueAtTime(40, now + 0.08);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      osc.start(now);
      osc.stop(now + 0.08);
    } else if (type === 'step') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(70 + Math.random() * 50, now);
      gain.gain.setValueAtTime(0.06, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
      osc.start(now);
      osc.stop(now + 0.04);
    } else if (type === 'hit') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.exponentialRampToValueAtTime(60, now + 0.12);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.start(now);
      osc.stop(now + 0.12);
    } else if (type === 'revive') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.linearRampToValueAtTime(800, now + 0.25);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc.start(now);
      osc.stop(now + 0.25);
    } else if (type === 'screamer') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(800, now);
      osc.frequency.exponentialRampToValueAtTime(100, now + 0.4);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      osc.start(now);
      osc.stop(now + 0.4);
    } else if (type === 'death') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(200, now);
      osc.frequency.exponentialRampToValueAtTime(20, now + 0.6);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
      osc.start(now);
      osc.stop(now + 0.6);
    }
  } catch(e) { /* ignore */ }
}

// ============================================================
// СОСТОЯНИЕ ИГРЫ
// ============================================================
let isHost = false;
let myPeerId = null;
let roomCode = '';
let room = null;
let myColorIndex = 0;
let playerColor = COLORS[0];

// Действия Trystero
let sendState = null;
let sendMove = null;
let sendShot = null;
let sendRevive = null;
let sendColorChange = null;
let sendLobbyUpdate = null;

// Локальное состояние
let lobbyPlayers = {}; // peerId -> {name, color, colorIndex, isHost}

// Игровое состояние (единое для всех)
let STATE = {
  started: false,
  gameOver: false,
  wave: 1,
  kills: 0,
  players: {},
  zombies: [],
  bullets: []
};

// Входные данные
let moveX = 0, moveY = 0;
let isFiring = false;
let fireTimer = 0;
let stepTimer = 0;
let isReviving = false;

// Здания / препятствия
const buildings = [];

function generateBuildings() {
  buildings.length = 0;
  // Несколько крупных шахтёрских построек
  const templates = [
    { x: 200, y: 200, w: 180, h: 140 },
    { x: 700, y: 150, w: 120, h: 180 },
    { x: 1200, y: 300, w: 160, h: 120 },
    { x: 300, y: 700, w: 140, h: 160 },
    { x: 850, y: 800, w: 200, h: 100 },
    { x: 1300, y: 750, w: 100, h: 180 },
    { x: 500, y: 450, w: 90, h: 90 },
    { x: 1000, y: 550, w: 110, h: 110 },
    { x: 150, y: 950, w: 160, h: 100 },
    { x: 1100, y: 1000, w: 140, h: 120 }
  ];
  templates.forEach(t => buildings.push(t));
}

// ============================================================
// NAVIGATION
// ============================================================
function showMenu() {
  menuScreen.style.display = 'flex';
  lobbyScreen.style.display = 'none';
  gameScreen.style.display = 'none';
}

function showLobby() {
  menuScreen.style.display = 'none';
  lobbyScreen.style.display = 'flex';
  gameScreen.style.display = 'none';
  document.getElementById('roomCodeDisplay').textContent = roomCode;
  updateLobbyUI();
}

function startGameScreen() {
  lobbyScreen.style.display = 'none';
  gameScreen.style.display = 'block';
  resizeCanvas();
  if (!gameLoopRunning) {
    gameLoopRunning = true;
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
  }
}

function backToMenu() {
  gameScreen.style.display = 'none';
  lobbyScreen.style.display = 'none';
  menuScreen.style.display = 'flex';
  document.getElementById('gameOverOverlay').style.display = 'none';
  
  STATE.started = false;
  STATE.gameOver = false;
  STATE.players = {};
  STATE.zombies = [];
  STATE.bullets = [];
  
  if (room) {
    try { room.leave(); } catch(e) {}
    room = null;
  }
  
  sendState = null;
  sendMove = null;
  sendShot = null;
  sendRevive = null;
  sendColorChange = null;
  sendLobbyUpdate = null;
  
  lobbyPlayers = {};
}

function updateLobbyUI() {
  const list = document.getElementById('playerList');
  list.innerHTML = '';
  const players = Object.values(lobbyPlayers);
  
  players.forEach((p, idx) => {
    const div = document.createElement('div');
    div.className = 'playerItem';
    div.innerHTML = `
      <div class="playerColorDot" style="background:${p.color};color:${p.color}"></div>
      <span class="playerName">${p.name}${p.isHost ? ' (хост)' : ''}</span>
    `;
    list.appendChild(div);
  });
  
  document.getElementById('statusText').textContent = 
    `Подключено: ${players.length} / 4`;
  
  if (isHost) {
    document.getElementById('startBtn').disabled = players.length < 1;
    document.getElementById('startBtn').style.display = 'block';
  } else {
    document.getElementById('startBtn').style.display = 'none';
  }
}

// ============================================================
// TRYSTERO P2P SETUP
// ============================================================
function setupTrystero() {
  const config = {
    appId: 'akod_v8_coop_survival',
    trackerUrls: [
      'wss://tracker.openwebtorrent.com',
      'wss://tracker.webtorrent.dev',
      'wss://tracker.btorrent.xyz'
    ]
  };
  
  room = joinRoom(config, 'room_' + roomCode);
  
  // Создание каналов
  const [sendStateAction, getStateAction] = room.makeAction('state');
  const [sendMoveAction, getMoveAction] = room.makeAction('move');
  const [sendShotAction, getShotAction] = room.makeAction('shot');
  const [sendReviveAction, getReviveAction] = room.makeAction('revive');
  const [sendColorChangeAction, getColorChangeAction] = room.makeAction('color');
  const [sendLobbyAction, getLobbyAction] = room.makeAction('lobby');
  
  sendState = sendStateAction;
  sendMove = sendMoveAction;
  sendShot = sendShotAction;
  sendRevive = sendReviveAction;
  sendColorChange = sendColorChangeAction;
  sendLobbyUpdate = sendLobbyAction;
  
  // Подписка на события пиров
  room.onPeerJoin(peerId => {
    console.log('Peer joined:', peerId);
    if (isHost) {
      // Хост назначает новому игроку цвет
      const usedColors = new Set(Object.values(lobbyPlayers).map(p => p.colorIndex));
      let colorIdx = 0;
      while (usedColors.has(colorIdx)) colorIdx++;
      
      lobbyPlayers[peerId] = {
        name: 'Игрок ' + Object.keys(lobbyPlayers).length,
        color: COLORS[colorIdx],
        colorIndex: colorIdx,
        isHost: false
      };
      
      // Добавляем игрока в игровое состояние
      const spawnOffset = Object.keys(STATE.players).length;
      STATE.players[peerId] = {
        x: WORLD_W / 2 + (spawnOffset * 40) - 60,
        y: WORLD_H / 2,
        angle: 0,
        hp: 100,
        color: COLORS[colorIdx],
        colorIndex: colorIdx,
        isDown: false,
        moveX: 0,
        moveY: 0,
        firing: false,
        reviving: false
      };
      
      updateLobbyUI();
      
      // Отправляем обновлённый список всем
      broadcastLobby();
    } else {
      // Клиент просто обновляет UI
      if (!lobbyPlayers[peerId]) {
        lobbyPlayers[peerId] = {
          name: 'Игрок',
          color: '#888',
          colorIndex: 0,
          isHost: false
        };
      }
      updateLobbyUI();
    }
  });
  
  room.onPeerLeave(peerId => {
    console.log('Peer left:', peerId);
    delete lobbyPlayers[peerId];
    delete STATE.players[peerId];
    updateLobbyUI();
    if (isHost) broadcastLobby();
  });
  
  // Получение lobby-обновлений (клиенты)
  getLobbyAction((data, peerId) => {
    if (!isHost) {
      lobbyPlayers = data.players;
      // Синхронизируем цвет хоста/себя
      if (data.myInfo) {
        myColorIndex = data.myInfo.colorIndex;
        playerColor = data.myInfo.color;
      }
      updateLobbyUI();
    }
  });
  
  // Получение состояния (только клиенты)
  getStateAction((data, peerId) => {
    if (!isHost) {
      const wasNotStarted = !STATE.started;
      STATE = data;
      
      if (wasNotStarted && STATE.started) {
        startGameScreen();
      }
      
      if (STATE.gameOver && !document.getElementById('gameOverOverlay').style.display) {
        document.getElementById('gameOverOverlay').style.display = 'flex';
        document.getElementById('finalWave').textContent = STATE.wave;
        document.getElementById('finalKills').textContent = STATE.kills;
      }
      
      updateHUD();
    }
  });
  
  // Получение input (только хост)
  getMoveAction((data, peerId) => {
    if (isHost && STATE.players[peerId]) {
      STATE.players[peerId].moveX = data.moveX || 0;
      STATE.players[peerId].moveY = data.moveY || 0;
      STATE.players[peerId].firing = data.firing || false;
      STATE.players[peerId].reviving = data.reviving || false;
    }
  });
  
  // Получение выстрела (хост создаёт пулю)
  getShotAction((data, peerId) => {
    if (isHost && STATE.players[peerId] && !STATE.players[peerId].isDown) {
      const p = STATE.players[peerId];
      STATE.bullets.push({
        x: p.x,
        y: p.y,
        vx: Math.cos(p.angle) * BULLET_SPEED,
        vy: Math.sin(p.angle) * BULLET_SPEED,
        life: 60,
        ownerId: peerId
      });
    }
  });
  
  // Получение запроса на воскрешение
  getReviveAction((data, peerId) => {
    if (isHost) {
      const healer = STATE.players[peerId];
      if (!healer || healer.isDown) return;
      
      Object.entries(STATE.players).forEach(([otherId, other]) => {
        if (otherId !== peerId && other.isDown) {
          const d = Math.hypot(other.x - healer.x, other.y - healer.y);
          if (d < 60) {
            other.isDown = false;
            other.hp = 50;
          }
        }
      });
    }
  });
  
  // Получение смены цвета (хост принимает)
  getColorChangeAction((data, peerId) => {
    if (isHost && STATE.players[peerId]) {
      STATE.players[peerId].color = data.color;
      STATE.players[peerId].colorIndex = data.colorIndex;
      if (lobbyPlayers[peerId]) {
        lobbyPlayers[peerId].color = data.color;
        lobbyPlayers[peerId].colorIndex = data.colorIndex;
      }
      updateLobbyUI();
      broadcastLobby();
    }
  });
  
  // selfId
  myPeerId = room.selfId || ('self_' + Math.random().toString(36).substr(2, 9));
  console.log('My peer ID:', myPeerId);
}

function broadcastLobby() {
  if (!sendLobbyUpdate) return;
  const players = { ...lobbyPlayers };
  
  Object.keys(lobbyPlayers).forEach(pid => {
    sendLobbyUpdate({
      players: players,
      myInfo: lobbyPlayers[pid]
    }, pid);
  });
}

// ============================================================
function initGame() {
  generateBuildings();
  STATE.zombies = [];
  STATE.bullets = [];
  STATE.wave = 1;
  STATE.kills = 0;
  STATE.gameOver = false;
  
  // Размещаем всех игроков в стартовой точке
  const players = Object.keys(STATE.players);
  players.forEach((pid, idx) => {
    STATE.players[pid].x = WORLD_W / 2 + (idx - players.length / 2) * 40;
    STATE.players[pid].y = WORLD_H / 2;
    STATE.players[pid].hp = 100;
    STATE.players[pid].isDown = false;
  });
  
  spawnWave();
}

function spawnWave() {
  const count = 3 + STATE.wave * 2;
  for (let i = 0; i < count; i++) {
    const type = (Math.random() < 0.2 + STATE.wave * 0.04) ? 'screamer' : 'normal';
    let x, y;
    const side = Math.floor(Math.random() * 4);
    if (side === 0) { x = Math.random() * WORLD_W; y = -20; }
    else if (side === 1) { x = Math.random() * WORLD_W; y = WORLD_H + 20; }
    else if (side === 2) { x = -20; y = Math.random() * WORLD_H; }
    else { x = WORLD_W + 20; y = Math.random() * WORLD_H; }
    
    STATE.zombies.push({
      x, y,
      type,
      hp: type === 'screamer' ? 2 : 3,
      angle: 0,
      attackCd: 0
    });
  }
}

// ============================================================
// GAME LOOP
// ============================================================
let gameLoopRunning = false;
let lastTime = 0;
let stateBroadcastTimer = 0;
let inputSendTimer = 0;

function gameLoop(timestamp) {
  const dt = Math.min(32, timestamp - lastTime);
  lastTime = timestamp;
  
  if (STATE.started) {
    if (isHost) {
      updateHostLogic(dt);
      
      stateBroadcastTimer += dt;
      if (stateBroadcastTimer >= HOST_BROADCAST_INTERVAL) {
        stateBroadcastTimer = 0;
        if (sendState) {
          sendState({
            started: STATE.started,
            gameOver: STATE.gameOver,
            wave: STATE.wave,
            kills: STATE.kills,
            players: JSON.parse(JSON.stringify(STATE.players)),
            zombies: JSON.parse(JSON.stringify(STATE.zombies)),
            bullets: JSON.parse(JSON.stringify(STATE.bullets))
          });
        }
      }
    } else {
      // Клиент отправляет input
      inputSendTimer += dt;
      if (inputSendTimer >= 50) {
        inputSendTimer = 0;
        if (sendMove) {
          sendMove({
            moveX: moveX,
            moveY: moveY,
            firing: isFiring,
            reviving: isReviving
          });
        }
      }
    }
    
    // Локальная обработка хоста
    if (isHost && STATE.players['host'] && !STATE.players['host'].isDown) {
      STATE.players['host'].moveX = moveX;
      STATE.players['host'].moveY = moveY;
      STATE.players['host'].firing = isFiring;
      STATE.players['host'].reviving = isReviving;
    }
    
    if (STATE.gameOver && document.getElementById('gameOverOverlay').style.display !== 'flex') {
      document.getElementById('gameOverOverlay').style.display = 'flex';
      document.getElementById('finalWave').textContent = STATE.wave;
      document.getElementById('finalKills').textContent = STATE.kills;
      playSound('death');
    }
    
    render();
    updateHUD();
  }
  
  requestAnimationFrame(gameLoop);
}

// ============================================================
// ЛОГИКА ХОСТА
// ============================================================
function updateHostLogic(dt) {
  const dtFactor = dt / 16.67;
  
  // Движение всех игроков
  Object.entries(STATE.players).forEach(([id, player]) => {
    if (player.isDown) return;
    
    const len = Math.sqrt(player.moveX * player.moveX + player.moveY * player.moveY);
    if (len > 0.1) {
      const nx = player.moveX / len;
      const ny = player.moveY / len;
      let newX = player.x + nx * PLAYER_SPEED * dtFactor;
      let newY = player.y + ny * PLAYER_SPEED * dtFactor;
      
      // Коллизия со зданиями
      let blocked = false;
      for (const b of buildings) {
        if (newX + PLAYER_RADIUS > b.x && newX - PLAYER_RADIUS < b.x + b.w &&
            newY + PLAYER_RADIUS > b.y && newY - PLAYER_RADIUS < b.y + b.h) {
          blocked = true;
          break;
        }
      }
      
      // Границы мира
      newX = Math.max(PLAYER_RADIUS, Math.min(WORLD_W - PLAYER_RADIUS, newX));
      newY = Math.max(PLAYER_RADIUS, Math.min(WORLD_H - PLAYER_RADIUS, newY));
      
      if (!blocked) {
        player.x = newX;
        player.y = newY;
      }
      player.angle = Math.atan2(ny, nx);
      
      // Шаги (только для хоста)
      if (id === 'host') {
        stepTimer += dt;
        if (stepTimer > 280) {
          stepTimer = 0;
          playSound('step');
        }
      }
    }
    
    // Авто-стрельба у хоста
    if (player.firing && id === 'host') {
      fireTimer += dt;
      if (fireTimer > 180) {
        fireTimer = 0;
        let nearest = null;
        let nearDist = Infinity;
        STATE.zombies.forEach(z => {
          const d = Math.hypot(z.x - player.x, z.y - player.y);
          if (d < nearDist) { nearDist = d; nearest = z; }
        });
        if (nearest && nearDist < 600) {
          const angle = Math.atan2(nearest.y - player.y, nearest.x - player.x);
          player.angle = angle;
          STATE.bullets.push({
            x: player.x,
            y: player.y,
            vx: Math.cos(angle) * BULLET_SPEED,
            vy: Math.sin(angle) * BULLET_SPEED,
            life: 60,
            ownerId: 'host'
          });
          playSound('shoot');
        }
      }
    } else if (id === 'host') {
      fireTimer = 150;
    }
    
    // Воскрешение
    if (player.reviving && id === 'host') {
      Object.entries(STATE.players).forEach(([otherId, other]) => {
        if (otherId !== id && other.isDown) {
          const d = Math.hypot(other.x - player.x, other.y - player.y);
          if (d < 60) {
            other.isDown = false;
            other.hp = 50;
            playSound('revive');
          }
        }
      });
    }
  });
  
  // Движение зомби
  STATE.zombies.forEach(zombie => {
    let target = null;
    let nearDist = Infinity;
    Object.values(STATE.players).forEach(p => {
      if (p.isDown) return;
      const d = Math.hypot(p.x - zombie.x, p.y - zombie.y);
      if (d < nearDist) { nearDist = d; target = p; }
    });
    
    if (target) {
      const angle = Math.atan2(target.y - zombie.y, target.x - zombie.x);
      zombie.angle = angle;
      const speed = zombie.type === 'screamer' ? SCREAMER_SPEED : ZOMBIE_SPEED;
      
      let newX = zombie.x + Math.cos(angle) * speed * dtFactor;
      let newY = zombie.y + Math.sin(angle) * speed * dtFactor;
      
      // Простая коллизия со зданиями для зомби
      let blocked = false;
      for (const b of buildings) {
        if (newX + ZOMBIE_RADIUS > b.x && newX - ZOMBIE_RADIUS < b.x + b.w &&
            newY + ZOMBIE_RADIUS > b.y && newY - ZOMBIE_RADIUS < b.y + b.h) {
          blocked = true;
          break;
        }
      }
      if (!blocked) {
        zombie.x = newX;
        zombie.y = newY;
      }
      
      // Атака
      if (nearDist < PLAYER_RADIUS + ZOMBIE_RADIUS) {
        zombie.attackCd -= dt;
        if (zombie.attackCd <= 0) {
          zombie.attackCd = 1000;
          target.hp -= zombie.type === 'screamer' ? 18 : 12;
          if (zombie.type === 'screamer') playSound('screamer');
          if (target.hp <= 0 && !target.isDown) {
            target.isDown = true;
            target.hp = 0;
            if (target === STATE.players['host']) playSound('death');
          }
        }
      }
    }
  });
  
  // Движение пуль
  STATE.bullets = STATE.bullets.filter(b => {
    b.x += b.vx * dtFactor;
    b.y += b.vy * dtFactor;
    b.life -= dtFactor;
    
    // Проверка попадания в зомби
    for (let i = STATE.zombies.length - 1; i >= 0; i--) {
      const z = STATE.zombies[i];
      if (Math.hypot(z.x - b.x, z.y - b.y) < ZOMBIE_RADIUS + 4) {
        z.hp--;
        if (z.hp <= 0) {
          STATE.zombies.splice(i, 1);
          STATE.kills++;
        }
        if (b.ownerId === 'host') playSound('hit');
        return false;
      }
    }
    
    // Коллизия со зданиями
    for (const bldg of buildings) {
      if (b.x > bldg.x && b.x < bldg.x + bldg.w && b.y > bldg.y && b.y < bldg.y + bldg.h) {
        return false;
      }
    }
    
    // Границы
    if (b.x < 0 || b.x > WORLD_W || b.y < 0 || b.y > WORLD_H) {
      return false;
    }
    
    return b.life > 0;
  });
  
  // Следующая волна
  if (STATE.zombies.length === 0 && STATE.started && !STATE.gameOver) {
    STATE.wave++;
    spawnWave();
  }
  
  // Game Over
  const alivePlayers = Object.values(STATE.players).filter(p => !p.isDown);
  if (alivePlayers.length === 0 && STATE.started) {
    STATE.gameOver = true;
  }
}

function updateHUD() {
  if (!STATE.started) return;
  
  document.getElementById('waveNum').textContent = STATE.wave;

      document.getElementById('hpFill').style.background = '#00FF7F';
    }
  }
}

// ============================================================
// РЕНДЕРИНГ
// ============================================================
function render() {
  ctx.fillStyle = '#050505';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  if (!STATE.started) return;
  
  // Цель камеры
  let camTarget;
  if (isHost) {
    camTarget = STATE.players['host'];
  } else {
    camTarget = STATE.players[myPeerId];
  }
  if (!camTarget) return;
  
  const camX = camTarget.x - canvas.width / 2;
  const camY = camTarget.y - canvas.height / 2;
  
  ctx.save();
  ctx.translate(-camX, -camY);
  
  // Сетка земли
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  const gridSize = 80;
  const startX = Math.floor(camX / gridSize) * gridSize;
  const startY = Math.floor(camY / gridSize) * gridSize;
  for (let x = startX; x < camX + canvas.width + gridSize; x += gridSize) {
    ctx.beginPath();
    ctx.moveTo(x, camY);
    ctx.lineTo(x, camY + canvas.height);
    ctx.stroke();
  }
  for (let y = startY; y < camY + canvas.height + gridSize; y += gridSize) {
    ctx.beginPath();
    ctx.moveTo(camX, y);
    ctx.lineTo(camX + canvas.width, y);
    ctx.stroke();
  }
  
  // Здания
  buildings.forEach(b => {
    // Тень
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(b.x + 4, b.y + 4, b.w, b.h);
    // Основа
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    // Крыша
    ctx.fillStyle = '#2a1810';
    ctx.fillRect(b.x + 4, b.y + 4, b.w - 8, b.h - 8);
    // Граница
    ctx.strokeStyle = '#3a3a3a';
    ctx.lineWidth = 2;
    ctx.strokeRect(b.x, b.y, b.w, b.h);
    // Окна (тёмные)
    ctx.fillStyle = '#0a0a0a';
    const windowSize = 12;
    for (let wx = b.x + 20; wx < b.x + b.w - 20; wx += 30) {
      for (let wy = b.y + 20; wy < b.y + b.h - 20; wy += 30) {
        ctx.fillRect(wx, wy, windowSize, windowSize);
      }
    }
  });
  
  // Граница мира
  ctx.strokeStyle = '#444';
  ctx.lineWidth = 3;
  ctx.strokeRect(0, 0, WORLD_W, WORLD_H);
  
  // Конусы света фонариков
  Object.values(STATE.players).forEach(p => {
    if (p.isDown) return;
    
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    
    // Градиент конуса
    const gradient = ctx.createRadialGradient(p.x, p.y, 15, p.x, p.y, 220);
    gradient.addColorStop(0, p.color + '60');
    gradient.addColorStop(0.5, p.color + '20');
    gradient.addColorStop(1, 'transparent');
    
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.arc(p.x, p.y, 220, p.angle - 0.55, p.angle + 0.55);
    ctx.closePath();
    ctx.fill();
    
    // Круглый ореол вокруг игрока
    const halo = ctx.createRadialGradient(p.x, p.y, 5, p.x, p.y, 50);
    halo.addColorStop(0, p.color + '40');
    halo.addColorStop(1, 'transparent');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 50, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.restore();
  });
  
  // Зомби
  STATE.zombies.forEach(z => {
    ctx.save();
    ctx.translate(z.x, z.y);
    ctx.rotate(z.angle);
    
    if (z.type === 'screamer') {
      ctx.fillStyle = '#ff2255';
      ctx.shadowColor = '#ff2255';
      ctx.shadowBlur = 12;
    } else {
      ctx.fillStyle = '#4a7a4a';
      ctx.shadowColor = '#4a7a4a';
      ctx.shadowBlur = 6;
    }
    
    ctx.beginPath();
    ctx.arc(0, 0, ZOMBIE_RADIUS, 0, Math.PI * 2);
    ctx.fill();
    
    // Глаза
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(5, -4, 3, 0, Math.PI * 2);
    ctx.arc(5, 4, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ff0000';
    ctx.beginPath();
    ctx.arc(6, -4, 1.5, 0, Math.PI * 2);
    ctx.arc(6, 4, 1.5, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.shadowBlur = 0;
    ctx.restore();
  });
  
  // Игроки
  Object.values(STATE.players).forEach(p => {
    ctx.save();
    ctx.translate(p.x, p.y);
    
    if (p.isDown) {
      // Раненый
      ctx.globalAlpha = 0.6;
      ctx.fillStyle = '#555';
      ctx.beginPath();
      ctx.arc(0, 0, PLAYER_RADIUS, 0, Math.PI * 2);
      ctx.fill();
      
      // Индикатор
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#ff4444';
      ctx.font = 'bold 14px Courier New';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('✚', 0, 0);
    } else {
      ctx.rotate(p.angle);
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(0, 0, PLAYER_RADIUS, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      
      // Ствол оружия
      ctx.fillStyle = '#ddd';
      ctx.fillRect(PLAYER_RADIUS - 2, -2, 12, 4);
      ctx.fillStyle = '#666';
      ctx.fillRect(PLAYER_RADIUS - 2, -2, 12, 1);
    }
    
    ctx.restore();
  });
  
  // Пули
  ctx.fillStyle = '#ffff44';
  ctx.shadowColor = '#ffff44';
  ctx.shadowBlur = 10;
  STATE.bullets.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.shadowBlur = 0;
  
  ctx.restore();
  
  // Виньетирование по краям
  const vignette = ctx.createRadialGradient(
    canvas.width / 2, canvas.height / 2, Math.min(canvas.width, canvas.height) * 0.3,
    canvas.width / 2, canvas.height / 2, Math.min(canvas.width, canvas.height) * 0.7
  );
  vignette.addColorStop(0, 'transparent');
  vignette.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

// ============================================================
// TOUCH CONTROLS — JOYSTICK
// ============================================================
const joystickArea = document.getElementById('joystickArea');
const joystickKnob = document.getElementById('joystickKnob');
let joystickTouchId = null;
let joystickCenterX = 0, joystickCenterY = 0;

joystickArea.addEventListener('touchstart', (e) => {
  e.preventDefault();
  initAudio();
  const touch = e.changedTouches[0];
  joystickTouchId = touch.identifier;
  const rect = joystickArea.getBoundingClientRect();
  joystickCenterX = rect.left + rect.width / 2;
  joystickCenterY = rect.top + rect.height / 2;
}, { passive: false });

joystickArea.addEventListener('touchmove', (e) => {
  e.preventDefault();
  for (const touch of e.changedTouches) {
    if (touch.identifier === joystickTouchId) {
      const dx = touch.clientX - joystickCenterX;
      const dy = touch.clientY - joystickCenterY;
      const dist = Math.min(Math.hypot(dx, dy), 50);
      const angle = Math.atan2(dy, dx);
      
      joystickKnob.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`;
      
      moveX = (Math.cos(angle) * dist) / 50;
      moveY = (Math.sin(angle) * dist) / 50;
    }
  }
}, { passive: false });

function joystickRelease(e) {
  e.preventDefault();
  for (const touch of e.changedTouches) {
    if (touch.identifier === joystickTouchId) {
      joystickTouchId = null;
      joystickKnob.style.transform = 'translate(0,0)';
      moveX = 0;
      moveY = 0;
    }
  }
}
joystickArea.addEventListener('touchend', joystickRelease, { passive: false });

fireBtn.addEventListener('touchstart', (e) => {
  e.preventDefault();
  initAudio();

  if (!isHost && sendShot && STATE.started) {

    let myPlayer = STATE.players[myPeerId];

      let nearest = null;
      let nearDist = Infinity;
      STATE.zombies.forEach(z => {
        const d = Math.hypot(z.x - myPlayer.x, z.y - myPlayer.y);
        if (d < nearDist) { nearDist = d; nearest = z; }
      });
      if (nearest && nearDist < 600) {
        const angle = Math.atan2(nearest.y - myPlayer.y, nearest.x - myPlayer.x);
        myPlayer.angle = angle;

}, { passive: false });

const keys = {};
document.addEventListener('keydown', (e) => {
  keys[e.key.toLowerCase()] = true;
  updateKeyboardInput();
  if (e.key === ' ' && !isFiring) {
    isFiring = true;
    if (!isHost && sendShot && STATE.started) {
      let myPlayer = STATE.players[myPeerId];
      if (myPlayer) {
        let nearest = null, nearDist = Infinity;
        STATE.zombies.forEach(z => {
          const d = Math.hypot(z.x - myPlayer.x, z.y - myPlayer.y);
          if (d < nearDist) { nearDist = d; nearest = z; }
        });
        if (nearest && nearDist < 600) {
          const angle = Math.atan2(nearest.y - myPlayer.y, nearest.x - myPlayer.x);
          sendShot({ targetAngle: angle });
        }
      }
    }
  }
  if (e.key.toLowerCase() === 'r' && !isReviving) {
    isReviving = true;
    if (isHost && STATE.started) {
      const host = STATE.players['host'];
      if (host && !host.isDown) {
        Object.entries(STATE.players).forEach(([otherId, other]) => {
          if (otherId !== 'host' && other.isDown) {
            const d = Math.hypot(other.x - host.x, other.y - host.y);
            if (d < 60) {
              other.isDown = false;
              other.hp = 50;
              playSound('revive');
            }
          }
        });
      }
    } else if (!isHost && sendRevive) {
      sendRevive({});
    }
  }
});

document.addEventListener('keyup', (e) => {
  keys[e.key.toLowerCase()] = false;
  updateKeyboardInput();
  if (e.key === ' ') isFiring = false;
  if (e.key.toLowerCase() === 'r') isReviving = false;
});

function updateKeyboardInput() {
  moveX = 0;
  moveY = 0;
  if (keys['w'] || keys['ц'] || keys['arrowup']) moveY -= 1;
  if (keys['s'] || keys['ы'] || keys['arrowdown']) moveY += 1;
  if (keys['a'] || keys['ф'] || keys['arrowleft']) moveX -= 1;
  if (keys['d'] || keys['в'] || keys['arrowright']) moveX += 1;
}
